<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>BasketBall Scoreboard</title>
</head>
<body>

    <div id="container">


        <div id="ScoreCard">
            <div class="score_side">
                <h3 class="title">HOME</h3>
                
                <div class="screen">
                    <h1 class="score" id="home_score"></h1>
                </div>
                <div class="score_btns">
                    <button class="btn" onclick="homeAdd1()">+1</button>
                    <button class="btn" onclick="homeAdd3()">+3</button>
                    <button class="btn" onclick="homeAdd5()">+5</button>
                </div>
            </div>
    
            <div class="score_side">
                <h3 class="title">AWAY</h3>
                <div class="screen">
                    <h1 class="score" id="guest_score"></h1>
                </div>
                <div class="score_btns">
                    <button class="btn" onclick="guestAdd1()">+1</button>
                    <button class="btn" onclick="guestAdd3()">+3</button>
                    <button class="btn" onclick="guestAdd5()">+5</button>
                </div>
            </div>
        </div>


        <div id="NewGame">
            <button class="newGameBtn" onclick="newGame()">NEW GAME</button>
        </div>

    </div>
    
    <script src="index.js"></script>
</body>
</html>
